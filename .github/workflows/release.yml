name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --collect-all playwright --collect-submodules pywinauto --collect-submodules comtypes --hidden-import psutil --name AutoJoin app.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoJoin.exe
