name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stamp version from tag
        shell: python
        run: |
          import os, pathlib, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          path = pathlib.Path("app.py")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(r'^VERSION = ".*"$', f'VERSION = "{version}"', text, flags=re.M)
          assert count == 1, "VERSION line not found"
          path.write_text(text, encoding="utf-8")
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --collect-all playwright --collect-submodules pywinauto --collect-submodules comtypes --hidden-import psutil --name AutoJoin app.py
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AutoJoin.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AutoJoin.exe" | Out-File -Encoding ascii dist/AutoJoin.exe.sha256
          Write-Host "SHA256: $hash"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AutoJoin.exe
            dist/AutoJoin.exe.sha256
